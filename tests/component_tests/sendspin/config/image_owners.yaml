esphome:
  name: test

esp32:
  variant: esp32p4
  framework:
    type: esp-idf

ethernet:
  type: OPENETH

spi:
  clk_pin: 18
  mosi_pin: 23

display:
  - platform: ili9xxx
    model: ili9342
    cs_pin: 22
    dc_pin: 21
    invert_colors: false

sendspin:
  id: sendspin_hub

image:
  - platform: sendspin
    id: album_slot
    format: JPEG
    type: RGB565
    byte_order: LITTLE_ENDIAN
    resize: 240x240
    current_image:
      id: album_art
    transition_image:
      id: album_art_transition

http_request:
  id: http_req

artwork_image:
  - id: retained_artwork
    url: https://example.com/artwork.jpg
    type: RGB565
    format: JPEG
    resize: 240x240
    hardware_jpeg: false
    sendspin_id: sendspin_hub
    buffer_size: 262144

generic_image:
  - platform: sendspin
    id: deferred_artwork
    format: JPEG
    type: RGB565
    resize: 120x120
    defer_decode: true
    paused: true
