packages:
  i2c: !include ../../test_build_components/common/i2c/esp32-p4-idf.yaml

display:
  - platform: mipi_dsi
    id: p4_display
    model: WAVESHARE-ESP32-P4-WIFI6-TOUCH-LCD-3.4C
touchscreen:
  - platform: gt911
    id: navigation_touchscreen
    i2c_id: i2c_bus
    display: p4_display

lvgl:
  byte_order: little_endian
  color_depth: 32
  use_ppa: true
  use_ppa_img: true
  touchscreens:
    - navigation_touchscreen
  pages:
    - id: home_widget_page
      widgets:
        - obj:
            id: home_widget_one
            width: 100%
            height: 100%
            widgets:
              - lottie:
                  id: test_lottie
                  file: "$component_dir/test.lottie.json"
                  width: 32
                  height: 32
                  loop: false
                  auto_start: false
                  opaque_background: 0x102030
              - image:
                  id: presenter_image_widget
                  src: presenter_test_image
                  width: 128
                  height: 128
              - button:
                  widgets:
                    - label:
                        text: Open
                  on_click:
                    - lvgl.lottie.start: test_lottie
                    - lvgl.lottie.pause: test_lottie
                    - lvgl.lottie.stop: test_lottie
                    - lvgl_image_presenter.pause: test_image_presenter
                    - lvgl_image_presenter.resume: test_image_presenter
                    - lvgl_image_presenter.restart: test_image_presenter
                    - lvgl_image_presenter.reset: test_image_presenter
                    - lvgl_image_presenter.pause_for_snapshot: test_image_presenter
                    - lvgl_image_presenter.complete_snapshot_handoff: test_image_presenter
                    - lvgl_image_presenter.transition:
                        id: test_image_presenter
                        source: presenter_test_image
                        duration: 500ms
                    - lvgl.navigation.open: test_application
        - obj:
            id: home_widget_two
            width: 100%
            height: 100%
            hidden: true
            widgets:
              - label:
                  text: Home 2
    - id: application_page
      widgets:
        - obj:
            id: application_scroll_root
            width: 100%
            height: 100%
            scrollable: true
            scrollbar_mode: "off"
            widgets:
              - button:
                  widgets:
                    - label:
                        text: Close
                  on_click:
                    - lvgl.snapshot.capture:
                        id: test_snapshots
                        page: application_page
                    - lvgl.snapshot.invalidate:
                        id: test_snapshots
                        page: application_page
                    - lvgl.snapshot.capture_all: test_snapshots
                    - lvgl.snapshot.clear: test_snapshots
                    - lvgl.snapshot_scroll.prepare: test_scroll_snapshot
                    - lvgl.snapshot_scroll.refresh: test_scroll_snapshot
                    - lvgl.snapshot_scroll.release: test_scroll_snapshot
                    - lvgl.navigation.close: test_navigation
              - label:
                  y: 900
                  text: End of scroll content
  navigation:
    id: test_navigation
    home:
      page: home_widget_page
      widgets:
        - home_widget_one
        - home_widget_two
    applications:
      - id: test_application
        page: application_page
        close_gesture: true
        on_open:
          - logger.log: Application opening
        on_opened:
          - logger.log: Application opened
        on_close:
          - logger.log: Application closing
        on_closed:
          - logger.log: Application closed
  snapshot_compositor:
    id: test_snapshots
    backend: direct
    compression: jpeg
    quality: 95
    max_entries: 4
    decoded_slots: 3
    preload: true
    settle_duration: 220ms
    application_transitions:
      open_duration: 500ms
      close_duration: 500ms
      start_size: 1%
      close_target_x: 50%
      close_target_y: 75%
    scroll_regions:
      - id: test_scroll_snapshot
        application: test_application
        widget: application_scroll_root
        preload: true
        max_content_size: 8MB
        overscroll: 15%
        momentum_duration: 560ms
        bounce_duration: 320ms
        max_inertia_duration: 900ms

psram:

esp32_jpeg:

image:
  - platform: file
    id: presenter_test_image
    file: "$component_dir/logo-text.svg"
    type: RGB
    resize: 128x128

lvgl_image_presenter:
  id: test_image_presenter
  widget: presenter_image_widget
  phase_duration: 10s
  frame_interval: 34ms
  zoom_start: 1.0
  zoom_end: 1.1
  pan_limit: 50%

esp_ldo:
  - channel: 3
    voltage: 2.5V
