display:
  - platform: mipi_dsi
    id: direct_display
    model: WAVESHARE-ESP32-P4-WIFI6-TOUCH-LCD-3.4C
    color_depth: 24
    pixel_mode: 24
    frame_buffer_count: 2

lvgl:
  displays: direct_display
  buffer_size: 100%
  color_depth: 32
  direct_mode: true
  use_ppa: true
  pages:
    - id: direct_home_one
      widgets:
        - obj:
            id: direct_home_one_view
            width: 100%
            height: 100%
            widgets:
              - image:
                  id: direct_presenter_widget
                  src: direct_presenter_image
                  width: 100%
                  height: 100%
    - id: direct_home_two
      widgets:
        - obj:
            id: direct_home_two_view
            width: 100%
            height: 100%
            widgets:
              - label:
                  text: Home 2
  navigation:
    id: direct_navigation
    swipe_start_distance: 0
    axis_bias: 0
    home:
      pages:
        - direct_home_one
        - direct_home_two
  snapshot_compositor:
    id: default_snapshots
    backend: direct
    preload: true
    home_views:
      - direct_home_one_view
      - direct_home_two_view

image:
  - platform: file
    id: direct_presenter_image
    file: "$component_dir/logo-text.svg"
    type: RGB
    resize: 128x128

lvgl_image_presenter:
  id: direct_presenter
  widget: direct_presenter_widget
  source: direct_presenter_image
  direct: true
  phase_duration: 10s
  frame_interval: 34ms
  zoom_start: 1.05
  zoom_end: 1.05
  pan_limit: 50%

psram:

esp_ldo:
  - channel: 3
    voltage: 2.5V

esphome:
  on_boot:
    then:
      - lvgl.navigation.prepare_applications: direct_navigation
      - lvgl.navigation.refresh: direct_navigation
      - if:
          condition:
            lvgl.navigation.home_snapshot_prepared: direct_navigation
          then:
            - logger.log: Home snapshots are prepared
