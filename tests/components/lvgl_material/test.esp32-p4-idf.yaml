packages:
  i2c: !include ../../test_build_components/common/i2c/esp32-p4-idf.yaml

display:
  - platform: mipi_dsi
    id: material_display
    model: WAVESHARE-ESP32-P4-WIFI6-TOUCH-LCD-3.4C

touchscreen:
  - platform: gt911
    id: material_touchscreen
    i2c_id: i2c_bus
    display: material_display

lvgl:
  displays: material_display
  touchscreens:
    - material_touchscreen
  widgets:
    - button:
        id: material_button
        width: 160
        height: 80
        radius: 40
        widgets:
          - label:
              text: Material
    - image:
        id: material_wavy_progress_image
        src: material_wavy_progress_source
        width: 244
        height: 244
    - button:
        id: material_previous_button
        width: 80
        height: 120
        radius: 40
        x: -120
        widgets:
          - label:
              text: Previous
    - button:
        id: material_next_button
        width: 80
        height: 120
        radius: 40
        x: 120
        widgets:
          - label:
              text: Next
    - button:
        id: material_pressed_style_button
        width: 160
        height: 80
        radius: 40
        y: -120
        widgets:
          - label:
              text: Shared style
    - obj:
        id: material_marquee_viewport
        width: 160
        height: 40
        y: -170
        border_width: 0
        pad_all: 0
        overflow_visible: false
        widgets:
          - label:
              id: material_marquee_label
              width: 320
              height: 40
              text: A deliberately long marquee test label
              long_mode: CLIP
    - obj:
        id: material_page_indicator_container
        width: 180
        height: 24
        y: 120
        bg_opa: TRANSP
        border_width: 0
    - button:
        id: material_volume_activation
        width: 120
        height: 48
        align: TOP_MID
        widgets:
          - label:
              text: "12:34"
    - arc:
        id: material_volume_arc
        width: 730
        height: 730
        align: CENTER
        min_value: 0
        max_value: 100
        value: 50
        start_angle: 180
        end_angle: 360
        adjustable: false
        arc_width: 15
        indicator:
          arc_width: 15
    - obj:
        id: material_volume_knob
        width: 56
        height: 56
        radius: 28
    - label:
        id: material_volume_label
        align: CENTER
        text: "50%"

lvgl_material:
  wavy_progress:
    - id: test_wavy_progress
      widget: material_wavy_progress_image
  direct_marquees:
    - id: test_direct_marquee
      label: material_marquee_label
      viewport: material_marquee_viewport
  direct_volume_overlays:
    - id: test_direct_volume_overlay
      arc: material_volume_arc
      knob: material_volume_knob
      label: material_volume_label
      activation_widget: material_volume_activation
      scrim_opacity: 72%
  pressed_styles:
    - id: test_pressed_style
      widgets:
        - material_pressed_style_button
      pressed_opacity: 70%
  direct_state_layers:
    - id: test_direct_state_layer
      widgets:
        - material_previous_button
        - material_next_button
      pressed_opacity: 12%
  state_layers:
    - id: test_state_layer
      widget: material_button
      color: black
      pressed_opacity: 12%
      enter_duration: 80ms
      exit_duration: 120ms
  page_indicators:
    - id: test_page_indicator
      container: material_page_indicator_container
      count: 4
      initial_page: 0
      active_size: 24
      inactive_size: 8
      thickness: 8
      gap: 8
      active_color: white
      inactive_color: 0x777777
      transition_duration: 160ms

interval:
  - interval: 5s
    then:
      - lvgl_material.page_indicator.set:
          id: test_page_indicator
          value: 1

psram:

image:
  - platform: file
    id: material_wavy_progress_source
    file: ../../pnglogo.png
    type: RGB
    resize: 244x244

esp_ldo:
  - channel: 3
    voltage: 2.5V
