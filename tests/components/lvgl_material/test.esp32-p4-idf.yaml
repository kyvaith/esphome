packages:
  i2c: !include ../../test_build_components/common/i2c/esp32-p4-idf.yaml

display:
  - platform: mipi_dsi
    id: material_display
    model: WAVESHARE-ESP32-P4-WIFI6-TOUCH-LCD-3.4C

touchscreen:
  - platform: gt911
    id: material_touchscreen
    i2c_id: i2c_bus
    display: material_display

lvgl:
  displays: material_display
  touchscreens:
    - material_touchscreen
  widgets:
    - button:
        id: material_button
        width: 160
        height: 80
        radius: 40
        widgets:
          - label:
              text: Material
    - button:
        id: material_previous_button
        width: 80
        height: 120
        radius: 40
        x: -120
        widgets:
          - label:
              text: Previous
    - button:
        id: material_next_button
        width: 80
        height: 120
        radius: 40
        x: 120
        widgets:
          - label:
              text: Next
    - button:
        id: material_pressed_style_button
        width: 160
        height: 80
        radius: 40
        y: -120
        widgets:
          - label:
              text: Shared style
    - obj:
        id: material_marquee_viewport
        width: 160
        height: 40
        y: -170
        border_width: 0
        pad_all: 0
        overflow_visible: false
        widgets:
          - label:
              id: material_marquee_label
              width: 320
              height: 40
              text: A deliberately long marquee test label
              long_mode: CLIP
    - obj:
        id: material_page_indicator_container
        width: 180
        height: 24
        y: 120
        bg_opa: TRANSP
        border_width: 0

lvgl_material:
  direct_marquees:
    - id: test_direct_marquee
      label: material_marquee_label
      viewport: material_marquee_viewport
  pressed_styles:
    - id: test_pressed_style
      widgets:
        - material_pressed_style_button
      pressed_opacity: 70%
  direct_state_layers:
    - id: test_direct_state_layer
      widgets:
        - material_previous_button
        - material_next_button
      pressed_opacity: 12%
  state_layers:
    - id: test_state_layer
      widget: material_button
      color: black
      pressed_opacity: 12%
      enter_duration: 80ms
      exit_duration: 120ms
  page_indicators:
    - id: test_page_indicator
      container: material_page_indicator_container
      count: 4
      initial_page: 0
      active_size: 24
      inactive_size: 8
      thickness: 8
      gap: 8
      active_color: white
      inactive_color: 0x777777
      transition_duration: 160ms

interval:
  - interval: 5s
    then:
      - lvgl_material.page_indicator.set:
          id: test_page_indicator
          value: 1

psram:

esp_ldo:
  - channel: 3
    voltage: 2.5V
