esphome:
  name: network-camera-test

esp32:
  board: esp32-p4-evboard
  variant: esp32p4
  engineering_sample: true
  framework:
    type: esp-idf
    advanced:
      enable_idf_experimental_features: true

psram:
  mode: hex
  speed: 200MHz

esp32_hosted:
  variant: ESP32C6
  slot: 1
  active_high: true
  reset_pin: GPIO15
  use_psram: true
  cmd_pin: GPIO13
  clk_pin: GPIO12
  d0_pin: GPIO11
  d1_pin: GPIO10
  d2_pin: GPIO9
  d3_pin: GPIO8

wifi:
  ssid: MySSID
  password: password1

logger:

esp32_jpeg:

esp_ldo:
  - channel: 3
    voltage: 2.5V

display:
  - platform: mipi_dsi
    model: JC1060P470
    enable_pin: GPIO22

<<: !include common.yaml
