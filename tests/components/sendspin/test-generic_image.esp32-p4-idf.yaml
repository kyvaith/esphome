esphome:
  name: sendspin-generic-image-p4-test

esp32:
  board: esp32-p4-evboard
  variant: esp32p4
  engineering_sample: true
  framework:
    type: esp-idf
    advanced:
      enable_idf_experimental_features: true

psram:
  mode: hex
  speed: 200MHz

esp32_hosted:
  variant: ESP32C6
  slot: 1
  active_high: true
  reset_pin: GPIO15
  use_psram: true
  cmd_pin: GPIO13
  clk_pin: GPIO12
  d0_pin: GPIO11
  d1_pin: GPIO10
  d2_pin: GPIO9
  d3_pin: GPIO8

wifi:
  ssid: MySSID
  password: password1

logger:

esp32_jpeg:

esp_ldo:
  - id: display_ldo
    channel: 3
    voltage: 2.5V

display:
  - platform: mipi_dsi
    model: JC1060P470
    enable_pin: GPIO22
    frame_buffer_count: 2

sendspin:
  id: sendspin_hub_id
  task_stack_in_psram: true

generic_image:
  - platform: sendspin
    id: album_art
    format: JPEG
    decoder: ESP32_JPEG
    type: RGB
    resize: 800x800
    source: ALBUM
    defer_decode: true
    paused: true
    retain_on_clear: true
    buffer_size: 262144
    on_decode_start:
      - logger.log: "Album art decode started"
    on_image_display:
      - logger.log: "Album art displayed"
    on_image_error:
      - logger.log: "Album art error"
  - platform: sendspin
    id: direct_artist_art
    format: JPEG
    decoder: ESP32_JPEG
    type: RGB565
    resize: 96x96
    source: ARTIST

script:
  - id: exercise_image_lifecycle
    then:
      - sendspin.image.pause: album_art
      - sendspin.image.resume: album_art
